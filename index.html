<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>little days</title><style>
.icon,.tile:nth-child(even) .icon{transform:none!important}
:root{--ink:#716258;--muted:#aa9c91;--paper:#fffdfa;--line:#eee2d6;--shadow:0 10px 26px #bda99518}*{box-sizing:border-box}body{margin:0;background:#fffaf4;background-image:radial-gradient(#efdadf 1.5px,transparent 1.5px);background-size:42px 42px;color:var(--ink);font:15px ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.app{max-width:720px;margin:auto;padding:30px 18px 54px}header{display:flex;gap:13px;align-items:center;margin-bottom:26px}.avatar{width:56px;height:56px;border-radius:20px;background:#dcc6ac;display:grid;place-items:center;font-size:24px}.hello{font-size:29px;font-weight:800;line-height:1.05}.hello span{outline:0;border-bottom:2px dashed #e0ccbc}.date{color:var(--muted);font-size:13px;margin-top:5px}.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tile{border:1px solid var(--line);border-radius:31px;background:var(--paper);min-height:155px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;color:var(--ink);font:inherit}.tile:hover{transform:translateY(-2px)}.tile.wide{grid-column:1/-1;min-height:135px}.icon{width:72px;height:72px;border-radius:25px;display:grid;place-items:center;font-size:33px}.tile:nth-child(1) .icon{background:#f6dfa6}.tile:nth-child(2) .icon{background:#f5ced8}.tile:nth-child(3) .icon{background:#c8d8bb}.tile:nth-child(4) .icon{background:#f4e997}.tile:nth-child(5) .icon{background:#d9cab7}.tile:nth-child(6) .icon{background:#e0d4ed}.tile:nth-child(7) .icon{background:#d8e5e4}.tile h2{font-size:17px;margin:9px 0 0}.count{position:absolute;right:15px;top:14px;min-width:27px;padding:4px 8px;border-radius:99px;background:#fff8f2;color:var(--muted);font-size:12px}.page{display:none;touch-action:pan-y}.page.show{display:block}.back{border:0;background:none;padding:0;margin:0 0 14px;color:#99897d;font:700 14px inherit;cursor:pointer}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:19px;box-shadow:var(--shadow);margin-bottom:15px}.card h2{font-size:17px;margin:0 0 15px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:13px}input,textarea,select{border:1px solid var(--line);background:#fffcf8;color:var(--ink);font:inherit;font-size:16px;border-radius:13px;padding:10px;outline:0}input,textarea{flex:1;min-width:130px}textarea{min-height:70px;resize:vertical;width:100%}.btn{border:0;border-radius:999px;padding:10px 14px;background:#e6aaa1;color:#fff;font:700 14px inherit;cursor:pointer}.btn.purple{background:#aa9ac5}.line{display:flex;gap:9px;align-items:center;padding:12px 1px;border-top:1px dashed var(--line)}.line:first-child{border-top:0}.line .name{flex:1}.delete{border:0;background:none;color:#c3aaa0;font-size:19px;cursor:pointer}.tag{font-size:11px;border-radius:99px;padding:4px 7px;white-space:nowrap}.high{background:#f5c9c6;color:#a1534f}.mid{background:#f8e5b8;color:#9d7835}.low{background:#e5efe0;color:#6a936e}.special{background:#e9e4f4;color:#8272a3}.moods,.strength{display:flex;gap:8px;flex-wrap:wrap}.moods button,.strength button{border:0;border-radius:15px;padding:9px 11px;background:#fff3ed;font-size:22px;cursor:pointer}.moods .on{background:#f3ced7}.strength .on.high{background:#f5c9c6}.strength .on.mid{background:#f8e5b8}.strength .on.low{background:#e5efe0}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:11px}.photo{aspect-ratio:1;border-radius:17px;overflow:hidden;background:#f5eee7;position:relative}.photo img{height:100%;width:100%;object-fit:cover}.photo .delete{position:absolute;right:7px;top:6px;width:26px;height:26px;background:#615950aa;color:#fff;border-radius:50%;z-index:1;opacity:0;pointer-events:none;transition:opacity .15s ease}.photo.reveal .delete{opacity:1;pointer-events:auto}.upload{position:relative;min-height:125px;border:1.5px dashed #e5cfc2;border-radius:18px;display:grid;place-items:center;text-align:center;color:#b58e82;cursor:pointer;background:#fffaf5;-webkit-user-select:none;user-select:none}.upload input{display:none}.upload .cam-main{pointer-events:none;line-height:1.4}.gallery-btn{position:absolute;left:10px;bottom:10px;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:18px;cursor:pointer;box-shadow:0 3px 9px #bda99522;padding:0}.moment{padding:11px 3px;border-top:1px dashed var(--line);position:relative;padding-right:30px}.time,.small{font-size:12px;color:var(--muted);margin-top:4px}.folder,.pet{display:flex;gap:11px;align-items:center;padding:12px 2px;border-top:1px dashed var(--line);cursor:pointer}.folder:first-child,.pet:first-child{border-top:0}.folder .name,.pet .name{flex:1}.folder-icon{width:45px;height:45px;border-radius:15px;background:#f3e49b;display:grid;place-items:center;font-size:22px}.notice{background:#f5edf8;border-radius:14px;padding:10px 12px;margin-bottom:12px;color:#8879a0;font-size:13px}.empty{text-align:center;color:var(--muted);padding:22px}.progress{height:7px;background:#eee8f5;border-radius:99px;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;background:#ad9ec7}.done{text-decoration:line-through;color:#b5aaa1}@media(max-width:480px){.app{padding:22px 13px}.tile{min-height:135px}.icon{width:63px;height:63px;font-size:29px}.tile.wide{min-height:120px}.hello{font-size:27px}}
</style></head><body><main class="app"><header><div class="avatar">●</div><div><div class="hello">Hi, <span id="username" contenteditable="true" spellcheck="false"></span></div><div class="date" id="today"></div></div></header><section id="home"><div class="home-grid"><button class="tile wide" data-page="wish"><span class="icon">♧</span><h2>wish</h2><span class="count" id="c-wish">0</span></button><button class="tile" data-page="mood"><span class="icon">☺</span><h2>mood</h2><span class="count" id="c-mood">0</span></button><button class="tile" data-page="plan"><span class="icon">☑</span><h2>plan</h2><span class="count" id="c-plan">0</span></button><button class="tile" data-page="pet"><span class="icon">🐾</span><h2>pet</h2><span class="count" id="c-pet">0</span></button><button class="tile" data-page="selfie"><span class="icon">◉</span><h2>selfie</h2><span class="count" id="c-selfie">0</span></button><button class="tile" data-page="quotes"><span class="icon">♡</span><h2>quotes</h2><span class="count" id="c-quotes">0</span></button><button class="tile" data-page="wishlist"><span class="icon">☆</span><h2>wish list</h2><span class="count" id="c-wishlist">0</span></button><button class="tile" data-page="birthday"><span class="icon">♢</span><h2>birthday</h2><span class="count" id="c-birthday">0</span></button></div></section>
<section class="page" id="plan"><button class="back">← home</button><div class="card"><h2>plan</h2><div class="row"><input id="planText" placeholder="add a plan"><div class="strength" id="strength"><button class="high" data-v="high">❗</button><button class="mid on" data-v="mid">⚠️</button><button class="low" data-v="low">💭</button></div><button class="btn" id="addPlan">add</button></div><div id="planList"></div></div></section>
<section class="page" id="mood"><button class="back">← home</button><div class="card"><h2>mood</h2><div class="moods" id="moodPick"><button class="on">😊</button><button>😌</button><button>🥰</button><button>😔</button><button>😣</button><button>😡</button></div><div class="row" style="margin-top:13px"><textarea id="moodNote" placeholder="note (optional)"></textarea><button class="btn" id="addMood">save</button></div><div id="moodList"></div></div></section>
<section class="page" id="selfie"><button class="back">← home</button><div class="card"><h2>selfie</h2><div class="upload" id="selfieUpload"><span class="cam-main">＋<br>add a photo</span><button type="button" class="gallery-btn" id="selfieGalleryBtn">🖼</button><input id="selfieFile" type="file" accept="image/*" capture="user"><input id="selfieFileGallery" type="file" accept="image/*"></div><div class="photo-grid" id="selfieList" style="margin-top:13px"></div></div></section>
<section class="page" id="pet"><button class="back">← home</button><div class="card"><h2 id="petTitle">pet</h2><div id="petArea"></div></div></section>
<section class="page" id="quotes"><button class="back">← home</button><div class="card"><h2>quotes</h2><div class="row"><input id="folderName" placeholder="folder name"><button class="btn" id="addFolder">add</button></div><div id="quoteArea"></div></div></section>
<section class="page" id="wishlist"><button class="back">← home</button><div class="card"><h2>wish list</h2><div class="row"><textarea id="wishText" placeholder="write a wish"></textarea><button class="btn" id="addWish">save</button></div><div class="upload" id="wishUpload"><span class="cam-main">＋<br>add a photo</span><button type="button" class="gallery-btn" id="wishGalleryBtn">🖼</button><input id="wishFile" type="file" accept="image/*" capture="environment"><input id="wishFileGallery" type="file" accept="image/*"></div><div class="photo-grid" id="wishList" style="margin-top:13px"></div></div></section>
<section class="page" id="birthday"><button class="back">← home</button><div class="card"><h2>birthday</h2><div id="birthdayNotice"></div><div class="row"><input id="friendName" placeholder="friend's name"><input id="friendDate" type="date"><button class="btn" id="addBirthday">add</button></div><div id="birthdayList"></div></div></section>
<section class="page" id="wish"><button class="back">← home</button><div class="card"><h2>balance</h2><div style="font-size:30px;color:#9b8bbb">¥<span id="balance">0</span></div></div><div class="card"><h2>earn</h2><div class="row"><input id="earnName" placeholder="task"><input id="earnAmount" type="number" min="1" placeholder="¥"><select id="earnType"><option value="daily">daily</option><option value="special">special</option></select><button class="btn" id="addEarn">add</button></div><div id="earnList"></div></div><div class="card"><h2>rewards</h2><div class="row"><input id="rewardName" placeholder="reward"><input id="rewardAmount" type="number" min="1" placeholder="¥"><button class="btn purple" id="addReward">add</button></div><div id="rewardList"></div></div></section></main>
<script>
const KEY='little-days-clean-v1';const blank={name:'you',plans:[],moods:[],selfies:[],pets:[],quotes:[],wishItems:[],birthdays:[],earn:[],rewards:[{id:1,name:'a new phone',amount:5699}],balance:0};let s=Object.assign({},blank,JSON.parse(localStorage.getItem(KEY)||'{}'));let activePet=null,activeFolder=null,level='mid',mood='😊';const $=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Date.now()+Math.random();const save=()=>{localStorage.setItem(KEY,JSON.stringify(s));render()};
$('today').textContent=new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',weekday:'short'}).format(new Date());$('username').textContent=s.name;$('username').onblur=()=>{s.name=$('username').textContent.trim()||'you';$('username').textContent=s.name;save()};document.querySelectorAll('.tile').forEach(x=>x.onclick=()=>show(x.dataset.page));document.querySelectorAll('.back').forEach(x=>x.onclick=home);function show(page){$('home').style.display='none';document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));$(page).classList.add('show');render()}function home(){document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));$('home').style.display='block';render()}
document.querySelectorAll('#strength button').forEach(b=>b.onclick=()=>{level=b.dataset.v;document.querySelectorAll('#strength button').forEach(x=>x.classList.toggle('on',x.dataset.v===level))});$('addPlan').onclick=()=>{let n=$('planText').value.trim();if(!n)return;s.plans.push({id:id(),name:n,level,done:false});$('planText').value='';save()};$('addMood').onclick=()=>{s.moods.unshift({id:id(),emoji:mood,note:$('moodNote').value.trim(),time:new Date().toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'})});$('moodNote').value='';save()};document.querySelectorAll('#moodPick button').forEach(b=>b.onclick=()=>{mood=b.textContent;document.querySelectorAll('#moodPick button').forEach(x=>x.classList.toggle('on',x===b))});
function readAsDataURL(file,cb){let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
function addPhoto(collection,src,extra={}){s[collection].unshift({id:id(),src,...extra,date:new Date().toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'})});save()}
function bindUploadTaps(uploadId,galleryBtnId,cameraId,galleryId,onFile){let up=$(uploadId),galBtn=$(galleryBtnId),cam=$(cameraId),gal=$(galleryId);up.onclick=()=>cam.click();galBtn.onclick=e=>{e.stopPropagation();gal.click()};cam.onchange=e=>{let f=e.target.files[0];if(!f)return;readAsDataURL(f,onFile);e.target.value=''};gal.onchange=e=>{let f=e.target.files[0];if(!f)return;readAsDataURL(f,onFile);e.target.value=''}}
function setupUpload(uploadId,galleryBtnId,cameraId,galleryId,collection,extra={}){bindUploadTaps(uploadId,galleryBtnId,cameraId,galleryId,src=>addPhoto(collection,src,extra))}
setupUpload('selfieUpload','selfieGalleryBtn','selfieFile','selfieFileGallery','selfies');setupUpload('wishUpload','wishGalleryBtn','wishFile','wishFileGallery','wishItems');$('addWish').onclick=()=>{let t=$('wishText').value.trim();if(!t)return;s.wishItems.unshift({id:id(),text:t});$('wishText').value='';save()};
function remove(collection,itemId){s[collection]=s[collection].filter(x=>x.id!==itemId);save()}function photoHtml(p,collection){return `<div class="photo"><button class="delete" data-del="${collection}" data-id="${p.id}">×</button><img src="${p.src}"><span class="time" style="position:absolute;bottom:6px;left:7px;color:#fff">${p.date||''}</span></div>`}function bindDelete(root=document){root.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();remove(b.dataset.del,+b.dataset.id)})}
function bindPhotoLongPress(root=document){root.querySelectorAll('.photo').forEach(p=>{if(p.dataset.lp)return;p.dataset.lp='1';let t=null;const start=ev=>{ev.preventDefault();t=setTimeout(()=>p.classList.add('reveal'),420)};const clear=()=>{clearTimeout(t);t=null};p.addEventListener('pointerdown',start);p.addEventListener('pointerup',clear);p.addEventListener('pointerleave',clear);p.addEventListener('pointercancel',clear);p.addEventListener('contextmenu',ev=>ev.preventDefault())});}
document.addEventListener('pointerdown',e=>{if(e.target.closest('.photo'))return;document.querySelectorAll('.photo.reveal').forEach(x=>x.classList.remove('reveal'))},true);
function renderPlan(){$('planList').innerHTML=s.plans.length?s.plans.sort((a,b)=>({high:0,mid:1,low:2}[a.level]-({high:0,mid:1,low:2}[b.level]))).map(x=>`<div class="line ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} data-plan="${x.id}"><span class="name">${esc(x.name)}</span><span class="tag ${x.level}">${({high:'❗ high',mid:'⚠️ mid',low:'💭 low'})[x.level]}</span><button class="delete" data-del="plans" data-id="${x.id}">×</button></div>`).join(''):'<div class="empty">nothing here yet.</div>';$('planList').querySelectorAll('[data-plan]').forEach(b=>b.onchange=()=>{let p=s.plans.find(x=>x.id===+b.dataset.plan);p.done=b.checked;save()})}
function renderMood(){$('moodList').innerHTML=s.moods.length?s.moods.map(x=>`<div class="moment"><b style="font-size:21px">${x.emoji}</b>${x.note?`<div>${esc(x.note)}</div>`:''}<div class="time">${x.time}</div><button class="delete" data-del="moods" data-id="${x.id}">×</button></div>`).join(''):'<div class="empty">nothing here yet.</div>';$('selfieList').innerHTML=s.selfies.length?s.selfies.map(x=>photoHtml(x,'selfies')).join(''):'<div class="empty">nothing here yet.</div>'}
function renderPet(){if(activePet){let p=s.pets.find(x=>x.id===activePet);if(!p){activePet=null;return renderPet()}let pics=p.photos||[];$('petTitle').textContent=p.name;$('petArea').innerHTML=`<button class="back" id="petBack">← pet</button><div class="upload" id="petUpload"><span class="cam-main">＋<br>add a photo</span><button type="button" class="gallery-btn" id="petGalleryBtn">🖼</button><input id="petFile" type="file" accept="image/*" capture="environment"><input id="petFileGallery" type="file" accept="image/*"></div><div class="photo-grid" id="petPics" style="margin-top:13px">${pics.map(x=>photoHtml(x,'petPhotos')).join('')}</div>`;$('petBack').onclick=()=>{activePet=null;renderPet()};bindUploadTaps('petUpload','petGalleryBtn','petFile','petFileGallery',src=>{p.photos=p.photos||[];p.photos.unshift({id:id(),src,date:new Date().toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'})});save()});$('petPics').querySelectorAll('[data-del="petPhotos"]').forEach(b=>b.onclick=()=>{p.photos=p.photos.filter(x=>x.id!==+b.dataset.id);save()})}else{$('petTitle').textContent='pet';$('petArea').innerHTML=`${s.pets.map(p=>`<div class="pet" data-pet="${p.id}"><div class="folder-icon">🐾</div><span class="name">${esc(p.name)}</span><span class="small">${(p.photos||[]).length}</span><button class="delete" data-rmpet="${p.id}">×</button></div>`).join('')||'<div class="empty">no pets yet.</div>'}<div class="row" style="margin-top:14px"><input id="newPet" placeholder="pet name"><button class="btn" id="addPet">add</button></div>`;$('addPet').onclick=()=>{let n=$('newPet').value.trim();if(!n)return;s.pets.push({id:id(),name:n,photos:[]});save()};$('petArea').querySelectorAll('[data-pet]').forEach(x=>x.onclick=e=>{if(e.target.dataset.rmpet)return;activePet=+x.dataset.pet;renderPet()});$('petArea').querySelectorAll('[data-rmpet]').forEach(b=>b.onclick=e=>{e.stopPropagation();s.pets=s.pets.filter(x=>x.id!==+b.dataset.rmpet);save()})}}
function renderQuotes(){if(activeFolder){let f=s.quotes.find(x=>x.id===activeFolder);if(!f){activeFolder=null;return renderQuotes()}$('quoteArea').innerHTML=`<button class="back" id="folderBack">← folders</button><h2>${esc(f.name)}</h2><div class="row"><textarea id="quoteText" placeholder="write a quote"></textarea><button class="btn" id="addQuote">save</button></div>${f.items.map(q=>`<div class="moment">${esc(q.text)}<button class="delete" data-rmquote="${q.id}">×</button></div>`).join('')}`;$('folderBack').onclick=()=>{activeFolder=null;renderQuotes()};$('addQuote').onclick=()=>{let t=$('quoteText').value.trim();if(!t)return;f.items.unshift({id:id(),text:t});save()};$('quoteArea').querySelectorAll('[data-rmquote]').forEach(b=>b.onclick=()=>{f.items=f.items.filter(x=>x.id!==+b.dataset.rmquote);save()})}else{$('quoteArea').innerHTML=`${s.quotes.map(f=>`<div class="folder" data-folder="${f.id}"><span class="folder-icon">▱</span><span class="name">${esc(f.name)}</span><span class="small">${f.items.length}</span><button class="delete" data-rmfolder="${f.id}">×</button></div>`).join('')||'<div class="empty">no folders yet.</div>'}`;$('quoteArea').querySelectorAll('[data-folder]').forEach(x=>x.onclick=e=>{if(e.target.dataset.rmfolder)return;activeFolder=+x.dataset.folder;renderQuotes()});$('quoteArea').querySelectorAll('[data-rmfolder]').forEach(b=>b.onclick=e=>{e.stopPropagation();s.quotes=s.quotes.filter(x=>x.id!==+b.dataset.rmfolder);save()})}}$('addFolder').onclick=()=>{let n=$('folderName').value.trim();if(!n)return;s.quotes.push({id:id(),name:n,items:[]});$('folderName').value='';save()};
function days(date){let d=new Date(date+'T00:00:00'),n=new Date(),x=new Date(n.getFullYear(),d.getMonth(),d.getDate()),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());if(x<t)x.setFullYear(x.getFullYear()+1);return Math.round((x-t)/86400000)}$('addBirthday').onclick=()=>{let n=$('friendName').value.trim(),d=$('friendDate').value;if(!n||!d)return;s.birthdays.push({id:id(),name:n,date:d});$('friendName').value=$('friendDate').value='';save()};function renderBirthday(){let soon=s.birthdays.filter(x=>days(x.date)<=7);$('birthdayNotice').innerHTML=soon.length?`<div class="notice">${soon.map(x=>`${esc(x.name)} · ${days(x.date)===0?'today':days(x.date)+' days'}`).join('<br>')}</div>`:'';$('birthdayList').innerHTML=s.birthdays.length?s.birthdays.slice().sort((a,b)=>days(a.date)-days(b.date)).map(x=>`<div class="line"><span class="name"><b>${esc(x.name)}</b><div class="time">${x.date} · ${days(x.date)===0?'today!':days(x.date)+' days to go'}</div></span><button class="delete" data-del="birthdays" data-id="${x.id}">×</button></div>`).join(''):'<div class="empty">no birthdays yet.</div>'}
function renderWish(){$('balance').textContent=s.balance.toLocaleString();$('earnList').innerHTML=s.earn.map(x=>x.type==='daily'?`<div class="line"><span class="name">${esc(x.name)} <span class="tag low">daily · ${x.times||0}</span></span><b>+¥${x.amount}</b><button class="btn" data-check="${x.id}">check in</button><button class="delete" data-del="earn" data-id="${x.id}">×</button></div>`:`<div class="line"><input type="checkbox" data-special="${x.id}"><span class="name">${esc(x.name)} <span class="tag special">special</span></span><b>+¥${x.amount}</b><button class="delete" data-del="earn" data-id="${x.id}">×</button></div>`).join('')||'<div class="empty">nothing here yet.</div>';$('earnList').querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{let x=s.earn.find(x=>x.id===+b.dataset.check);x.times=(x.times||0)+1;s.balance+=x.amount;save()});$('earnList').querySelectorAll('[data-special]').forEach(b=>b.onchange=()=>{let x=s.earn.find(x=>x.id===+b.dataset.special);s.balance+=x.amount;s.earn=s.earn.filter(y=>y!==x);save()});$('rewardList').innerHTML=s.rewards.map(x=>{let pct=Math.min(100,s.balance/x.amount*100);return `<div class="line"><span class="name"><b>${esc(x.name)}</b><div class="time">¥${x.amount} · ¥${Math.max(0,x.amount-s.balance)} to go</div><div class="progress"><i style="width:${pct}%"></i></div></span><button class="btn purple" data-buy="${x.id}" ${s.balance<x.amount?'disabled':''}>buy</button><button class="delete" data-del="rewards" data-id="${x.id}">×</button></div>`}).join('');$('rewardList').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let x=s.rewards.find(x=>x.id===+b.dataset.buy);s.balance-=x.amount;save()})}$('addEarn').onclick=()=>{let n=$('earnName').value.trim(),a=+$('earnAmount').value;if(!n||!a)return;s.earn.push({id:id(),name:n,amount:a,type:$('earnType').value,times:0});$('earnName').value=$('earnAmount').value='';save()};$('addReward').onclick=()=>{let n=$('rewardName').value.trim(),a=+$('rewardAmount').value;if(!n||!a)return;s.rewards.push({id:id(),name:n,amount:a});$('rewardName').value=$('rewardAmount').value='';save()};
function render(){$('c-plan').textContent=s.plans.filter(x=>!x.done).length;$('c-mood').textContent=s.moods.length;$('c-selfie').textContent=s.selfies.length;$('c-pet').textContent=s.pets.length;$('c-quotes').textContent=s.quotes.reduce((n,x)=>n+x.items.length,0);$('c-wishlist').textContent=s.wishItems.length;$('c-birthday').textContent=s.birthdays.filter(x=>days(x.date)<=7).length;$('c-wish').textContent=s.rewards.length;renderPlan();renderMood();renderPet();renderQuotes();$('wishList').innerHTML=s.wishItems.length?s.wishItems.map(x=>x.src?photoHtml(x,'wishItems'):`<div class="moment">${esc(x.text)}<button class="delete" data-del="wishItems" data-id="${x.id}">×</button></div>`).join(''):'<div class="empty">nothing here yet.</div>';renderBirthday();renderWish();bindDelete();bindPhotoLongPress()}render();
/* class timetable + deadline calendar */
s.timetable=s.timetable||[];s.deadlines=s.deadlines||[];let calMonth=new Date();document.querySelector('.home-grid').insertAdjacentHTML('beforeend','<button class="tile" data-page="class"><span class="icon">▤</span><h2>class</h2><span class="count" id="c-class">0</span></button><button class="tile" data-page="deadline"><span class="icon">▦</span><h2>deadline</h2><span class="count" id="c-deadline">0</span></button>');document.querySelector('.app').insertAdjacentHTML('beforeend','<section class="page" id="class"><button class="back">← home</button><div class="card"><h2>class</h2><div class="row"><select id="classDay"><option>Mon</option><option>Tue</option><option>Wed</option><option>Thu</option><option>Fri</option><option>Sat</option><option>Sun</option></select><input id="classTime" placeholder="time, e.g. 09:00"><input id="className" placeholder="class name"><button class="btn" id="addClass">add</button></div><div id="classTable"></div></div></section><section class="page" id="deadline"><button class="back">← home</button><div class="card"><h2>deadline</h2><div class="row"><input id="deadlineName" placeholder="task"><input id="deadlineDate" type="date"><button class="btn" id="addDeadline">add</button></div><div class="calendar-head"><button class="back" id="calPrev">←</button><b id="calTitle"></b><button class="back" id="calNext">→</button></div><div class="calendar-week">Sun Mon Tue Wed Thu Fri Sat</div><div class="calendar" id="calendar"></div><div id="deadlineList"></div></div></section>');document.querySelectorAll('.tile').forEach(x=>x.onclick=()=>show(x.dataset.page));document.querySelectorAll('#class .back,#deadline .back').forEach(x=>x.onclick=home);const calCss=document.createElement('style');calCss.textContent='.calendar-head{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.calendar-week{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--muted);text-align:center;word-spacing:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 15px}.day{min-height:52px;border-radius:10px;background:#fff8f2;padding:5px;font-size:11px}.day.empty{background:transparent}.day b{font-size:12px}.day .dot{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#a06f79;font-size:10px;margin-top:3px}';document.head.append(calCss);$('addClass').onclick=()=>{let n=$('className').value.trim(),t=$('classTime').value.trim();if(!n)return;s.timetable.push({id:id(),day:$('classDay').value,time:t,name:n});$('className').value=$('classTime').value='';save()};$('addDeadline').onclick=()=>{let n=$('deadlineName').value.trim(),d=$('deadlineDate').value;if(!n||!d)return;s.deadlines.push({id:id(),name:n,date:d});$('deadlineName').value=$('deadlineDate').value='';save()};$('calPrev').onclick=()=>{calMonth.setMonth(calMonth.getMonth()-1);drawStudy()};$('calNext').onclick=()=>{calMonth.setMonth(calMonth.getMonth()+1);drawStudy()};function drawStudy(){let days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];$('classTable').innerHTML=days.map(d=>`<div class="line"><b style="width:38px">${d}</b><span class="name">${s.timetable.filter(x=>x.day===d).sort((a,b)=>a.time.localeCompare(b.time)).map(x=>`${esc(x.time)} ${esc(x.name)} <button class="delete" data-rmclass="${x.id}">×</button>`).join('<br>')||'—'}</span></div>`).join('');$('classTable').querySelectorAll('[data-rmclass]').forEach(b=>b.onclick=()=>{s.timetable=s.timetable.filter(x=>x.id!==+b.dataset.rmclass);save()});let y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();$('calTitle').textContent=calMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});let html='';for(let i=0;i<first;i++)html+='<div class="day empty"></div>';for(let d=1;d<=last;d++){let key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,items=s.deadlines.filter(x=>x.date===key);html+=`<div class="day"><b>${d}</b>${items.map(x=>`<span class="dot">${esc(x.name)}</span>`).join('')}</div>`}$('calendar').innerHTML=html;$('deadlineList').innerHTML=s.deadlines.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="line"><span class="name">${esc(x.name)}<div class="time">${x.date}</div></span><button class="delete" data-rmdeadline="${x.id}">×</button></div>`).join('')||'<div class="empty">no deadlines yet.</div>';$('deadlineList').querySelectorAll('[data-rmdeadline]').forEach(b=>b.onclick=()=>{s.deadlines=s.deadlines.filter(x=>x.id!==+b.dataset.rmdeadline);save()});$('c-class').textContent=s.timetable.length;$('c-deadline').textContent=s.deadlines.length}const oldRender=render;render=function(){oldRender();drawStudy()};drawStudy();
function bindSwipeBack(){document.querySelectorAll('.page').forEach(page=>{if(page.dataset.swipeBound)return;page.dataset.swipeBound='1';let startX=0,startY=0,dx=0,active=false,locked=false,decided=false;const THRESHOLD=90;const skip=t=>t.closest('input,textarea,select,button,[contenteditable]');page.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(skip(e.target))return;active=true;decided=false;locked=false;startX=e.clientX;startY=e.clientY;dx=0;page.style.transition='none'});page.addEventListener('pointermove',e=>{if(!active)return;dx=e.clientX-startX;const dy=e.clientY-startY;if(!decided){if(Math.abs(dx)<12&&Math.abs(dy)<12)return;decided=true;locked=Math.abs(dx)>Math.abs(dy)&&dx>0;if(!locked){active=false;return}}if(!locked)return;page.style.transform=`translateX(${dx}px)`;page.style.opacity=String(Math.max(0.5,1-dx/500))});const end=()=>{if(!active){locked=false;decided=false;return}active=false;if(!locked){decided=false;return}page.style.transition='transform .22s ease, opacity .22s ease';if(dx>THRESHOLD){page.style.transform='translateX(100%)';page.style.opacity='0';setTimeout(()=>{page.style.transition='';page.style.transform='';page.style.opacity='';home()},210)}else{page.style.transform='translateX(0)';page.style.opacity='1';setTimeout(()=>{page.style.transition=''},220)}locked=false;decided=false};page.addEventListener('pointerup',end);page.addEventListener('pointercancel',end)})}
const deadlineCard=$('deadline').querySelector('.card'),deadlineRow=$('deadlineName').parentElement;deadlineCard.insertBefore($('calTitle').parentElement,deadlineRow);deadlineCard.insertBefore(document.querySelector('.calendar-week'),deadlineRow);deadlineCard.insertBefore($('calendar'),deadlineRow);bindSwipeBack();
